};
const desktopWorlds=[
 {n:'Szkoła Maliwan',d:'Poznaj szkołę masażu',url:'https://thaimaliwan.pl/szkola/',ic:'szkola'},
 {n:'Maliwan Ritual',d:'Odkryj nasze rytuały',url:'https://thaimaliwan.pl/oferta/rytualy-spa/',ic:'lotos'},
 {n:'Menu masaży',d:'Wybierz swoją chwilę relaksu',url:'menu-filmowe-salony.html',ic:'mandala'}
];
let desktopWorldOffset=0;
const worldsDialog=document.getElementById('worldsDialog');
document.getElementById('worldsLinks').innerHTML=desktopWorlds.map(w=>'<a href="'+w.url+'" target="_blank" rel="noopener">'+w.n+'<small>'+w.d+'</small></a>').join('');
function paintDesktopWorlds(){[0,1].forEach(k=>{const w=desktopWorlds[(desktopWorldOffset+k)%desktopWorlds.length],el=document.getElementById('orb'+k);el.setAttribute('aria-label',w.n);el.title=w.n;el.querySelector('.orb-face').innerHTML=ICONS[w.ic]();el.onclick=()=>window.open(w.url,'_blank','noopener');});}
document.getElementById('worldDot').onclick=()=>worldsDialog.showModal();
document.getElementById('closeWorlds').onclick=()=>worldsDialog.close();
document.getElementById('railNext').onclick=()=>{desktopWorldOffset=(desktopWorldOffset+1)%desktopWorlds.length;paintDesktopWorlds();};
worldsDialog.addEventListener('click',e=>{if(e.target===worldsDialog){const b=worldsDialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)worldsDialog.close();}});
paintDesktopWorlds();
// Footer controls must not start a drag on the reel behind them.
for(const el of document.querySelectorAll('.world-rail,.legal-dock,.worlds-dialog'))el.addEventListener('pointerdown',e=>e.stopPropagation());
